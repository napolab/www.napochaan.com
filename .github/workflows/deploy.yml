name: Deploy

on:
  # main へのマージで staging を自動デプロイ
  push:
    branches: [main]
  # production は手動 dispatch（GitHub Environment "production" の承認ゲート経由）
  workflow_dispatch:

permissions:
  contents: read

# 同一環境への多重デプロイは直列化（途中キャンセルしない）
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  staging:
    if: github.event_name == 'push'
    name: deploy staging
    runs-on: ubuntu-latest
    # 実績は 4 分前後。ジョブ既定の 360 分だと、ハングしたデプロイが
    # concurrency group を掴んだまま後続を止め続ける。
    timeout-minutes: 30
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # next build / opennext build が CloudflareEnv 型を解決できるよう、両 app 分を再生成
      - run: pnpm --filter cms cf:types
      - run: pnpm --filter web cf:types
      # D1 は cms だけが持つ。migrate の前に、D1 に適用済みなのにコードから消えたマイグレーション（revert 等）を検出して止める。
      # payload migrate はローカルのファイルしか見ないので、放置すると食い違ったコードが黙ってデプロイされる。
      # 失敗時の復旧手順は docs/migration-rollback.md
      - run: pnpm --filter cms deploy:database:check:staging
      # worker deploy の前に D1 スキーマを反映（remote binding 経由）
      - run: pnpm --filter cms deploy:database:staging
      # deploy は cms → web の順（web の CMS binding の向き先から）。
      # 既存の Worker 名なら定常順で通る。新規名の環境は cms(WEB なし) → web → cms(WEB あり) が要る。
      - run: pnpm --filter cms deploy:staging
      # opennext build → deploy。ISR は使わないので cache bust は無い（CMS 書込みは cms → env.WEB.purge()）
      # Workers Cache warm-up は stg.napochaan.com が Cloudflare Access（ホスト全体）配下のため未対応
      # （未認証 curl は Access ログインへ 302 するので CI から warm できない）
      - run: pnpm --filter web deploy:staging

  production:
    if: github.event_name == 'workflow_dispatch'
    name: deploy production
    runs-on: ubuntu-latest
    # timeout-minutes は意図的に付けていない。required reviewers の承認待ち時間が
    # ジョブのタイムアウトに算入されるかを確認できておらず、算入されるなら
    # 「承認待ちのまま自動キャンセル」になってしまうため。
    # 承認ゲートの無い staging では付けている。挙動を確認できたらここにも入れること。
    # Environment 保護ルール（required reviewers）でデプロイ前に承認を要求する
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter cms cf:types
      - run: pnpm --filter web cf:types
      # revert で孤立したマイグレーションがあれば migrate / deploy の前に止める（staging と同じ理由）
      - run: pnpm --filter cms deploy:database:check:production
      - run: pnpm --filter cms deploy:database:production
      # cms → web の順（staging と同じ理由）
      - run: pnpm --filter cms deploy:production
      # opennext build → deploy → Workers Cache warm-up（sitemap 全 URL + feeds。napochaan.com は Access 無し）
      - run: pnpm --filter web deploy:production
